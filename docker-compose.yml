services:
  postgres:
    image: postgres:15
    container_name: streamora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: streamora
      POSTGRES_PASSWORD: streamora
      POSTGRES_DB: streamora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: streamora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
